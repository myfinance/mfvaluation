server.port: 30034
server.host: localhost
env:
  #host: 192.168.100.73
  # in case you want to run rabbitMq and keycloak on a dev server and not on your local machine like the software componentens(MFcomposite, mfinstrument...)
  host: ${server.host}

logging:
  level:
    root: ERROR
    de.hf.myfinance: ERROR

springdoc:
  swagger-ui.path: /openapi/swagger-ui.html
  api-docs.path: /openapi/v3/api-docs
  packagesToScan: de.hf.myfinance
  pathsToMatch: /**

spring.data.mongodb:
  host: ${env.host}
  port: 30023
  database: valuation-db
  authentication-database: admin
  username: root
  password: vulkan
  auto-index-creation: true

spring:
  cloud:
    function:
      definition: extractCashflowsAndTradesProcessor;saveTradeProcessor;saveCashflowsProcessor;saveInstrumentProcessor;saveMarketDataProcessor;valuationProcessor;positionProcessor;saveValueCurveProcessor;positionValueProcessor;savePositionProcessor;savePositionValueProcessor;savePortfolioMetricsProcessor;portfolioMetricsProcessor

spring.cloud.stream:
  defaultBinder: rabbit
  default.contentType: application/json
  bindings.extractCashflowsAndTradesProcessor-in-0:
    destination: transactionApproved
    group: extractCashflow4ValuationGroup
  bindings.saveTradeProcessor-in-0:
    destination: extractedTrade
    group: saveTradeGroup
  bindings.saveCashflowsProcessor-in-0:
    destination: extractedCashflows
    group: saveCashflow4ValuationGroup
  bindings.saveInstrumentProcessor-in-0:
    destination: instrumentApproved
    group: saveInstrumentValuationGroup
  bindings.saveMarketDataProcessor-in-0:
    destination: pricesupdated
    group: saveprices4ValuationGroup
  bindings.valuationProcessor-in-0:
    destination: valuationDataChanged
    group: valuationGroup
  bindings.saveValueCurveProcessor-in-0:
    destination: valueCurveCalculated
    group: saveValueCurveGroup
  bindings.positionProcessor-in-0:
    destination: tradeSavedForPositionBuilding
    group: calcPositionGroup
  bindings.positionValueProcessor-in-0:
    destination: positionSaved
    group: calcPositionValueGroup
  bindings.savePositionProcessor-in-0:
    destination: positionBuilded
    group: savePostionGroup
  bindings.savePositionValueProcessor-in-0:
    destination: positionValueCalculated
    group: savePositionValueGroup
  bindings.savePortfolioMetricsProcessor-in-0:
    destination: portfolioMetricsCalculated
    group: savePortfolioMetricsGroup
  bindings.portfolioMetricsProcessor-in-0:
    destination: calculatePortfolioMetrics
    group: calculatePortfolioMetricsGroup
  bindings.valuationDataChanged-out-0:
    destination: valuationDataChanged
    producer:
      required-groups: valuationGroup
  bindings.extractedCashflows-out-0:
    destination: extractedCashflows
    producer:
      required-groups: saveCashflow4ValuationGroup
  bindings.valueCurveCalculated-out-0:
    destination: valueCurveCalculated
    producer:
      required-groups: saveValueCurveGroup
  bindings.extractedTrade-out-0:
    destination: extractedTrade
    producer:
      required-groups: saveTradeGroup   
  bindings.tradeSaved-out-0:
    destination: tradeSavedForPositionBuilding
    producer:
      required-groups: calcPositionGroup 
  bindings.positionBuilded-out-0:
    destination: positionBuilded
    producer:
      required-groups: savePostionGroup  
  bindings.positionSaved-out-0:
    destination: positionSaved
    producer:
      required-groups: calcPositionValueGroup   
  bindings.positionValueCalculated-out-0:
    destination: positionValueCalculated
    producer:
      required-groups: savePositionValueGroup     
  bindings.portfolioMetricsCalculated-out-0:
    destination: portfolioMetricsCalculated
    producer:
      required-groups: savePortfolioMetricsGroup    
  bindings.portfolioMetrics-out-0:
    destination: calculatePortfolioMetrics
    producer:
      required-groups: calculatePortfolioMetricsGroup                   
 

spring.rabbitmq:
  host: ${env.host}
  port: 30021
  username: user
  password: vulkan

api:

  common:
    version: 1.0.0
    title: mfvaluation API
    description: REST API for valuation informations of instruments.

  responseCodes:
    ok.description: OK
    badRequest.description: Bad Request, invalid format of the request. See response message for more information
    notFound.description: Not found, the specified id does not exist
    unprocessableEntity.description: Unprocessable entity, input parameters caused the processing to fail. See response message for more information

  ValuationApi:

    getValueCurve:
      description: Returns the values of the instrument for the businesskey for each day between startdate and enddate
      notes: |
        # Normal response
        If the requested product id is found the method will return information regarding:
        1. Base product information
        1. Reviews
        1. Recommendations
        1. Service Addresses\n(technical information regarding the addresses of the microservices that created the response)
        # Expected partial and error responses
        In the following cases, only a partial response be created (used to simplify testing of error conditions)
        ## Product id 113
        200 - Ok, but no recommendations will be returned
        ## Product id 213
        200 - Ok, but no reviews will be returned
        ## Non numerical product id
        400 - A **Bad Request** error will be returned
        ## Product id 13
        404 - A **Not Found** error will be returned
        ## Negative product ids
        422 - An **Unprocessable Entity** error will be returned




